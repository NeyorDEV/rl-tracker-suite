<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LobbyTracker – Overlay du lobby</title>
<!-- Une seule page pour l'overlay en jeu (fenêtre Tauri) et la source navigateur OBS (/lobby). -->
<style>
  :root { --a: .82; --bg: 12, 14, 20; --text: #ffffff; --muted: #9aa4b8;
          --opponent: #ff7a2b; --teammate: #3b9dff; --unknown: #888888;
          --b-smurf: #e03a3a; --b-1v1: #7b2cff; --b-anchor: #7b2cff; --b-tilt: #6b7280; --b-peak: #b7791f; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
               font: 600 14px "Segoe UI", system-ui, sans-serif; color: var(--text); }
  body.offline { opacity: .45; }
  body.app { cursor: grab; }
  body.app:active { cursor: grabbing; }
  #wrap { display: inline-block; width: max-content; position: relative; transform-origin: 0 0; }
  #wrap.card_vertical { width: 360px; }
  #wrap.column { width: 480px; }
  #dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%;
         background: #ffcf5c; opacity: 0; transition: opacity .2s; }
  #dot.on { opacity: 1; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  #list { display: flex; gap: 4px; }
  #list.card_vertical, #list.column { flex-direction: column; }
  #list.card_horizontal, #list.row { flex-direction: row; align-items: flex-start; }

  .card { padding: 6px 10px; background: rgba(var(--bg), var(--a)); border-left: 4px solid var(--unknown); border-radius: 6px; }
  #list.card_horizontal .card { width: 230px; flex: none; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: rgba(var(--bg), var(--a));
          border-left: 4px solid var(--unknown); border-radius: 6px; white-space: nowrap; }
  #list.row .chip { flex: none; }
  .opponent { border-left-color: var(--opponent); }
  .teammate { border-left-color: var(--teammate); }

  .row-top { display: flex; justify-content: space-between; gap: 8px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .name { max-width: 150px; }
  .chip .grow { flex: 1; }
  .idx { color: #ffcf5c; font-size: 12px; }
  .rk { white-space: nowrap; }
  .rk i { font-style: normal; color: var(--muted); }
  .rk.peak { color: #ffcf5c; }
  .ranks, .loading, .best { font-size: 12px; color: color-mix(in srgb, var(--text) 85%, transparent); font-weight: 500; }
  .loading { color: var(--muted); font-weight: 400; }
  .met { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .chip .met { margin: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .chip .badges { margin: 0; flex-wrap: nowrap; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--b-1v1); white-space: nowrap; }
  .badge.smurf_suspect { background: var(--b-smurf); }
  .badge.one_v_one_specialist { background: var(--b-1v1); }
  .badge.defensive_anchor { background: var(--b-anchor); }
  .badge.on_tilt { background: var(--b-tilt); }
  .badge.peak_disparity { background: var(--b-peak); }
</style>
</head>
<body>
<div id="wrap" class="card_vertical"><span id="dot"></span><div id="list" class="card_vertical"></div></div>
<script>
  const tauri = window.__TAURI__;
  const isApp = !!tauri;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let layout = "card_vertical", scale = 100;

  // Rangs utiles seulement : mode joué, puis 1v1 / meilleur rang / rang actuel et pic selon le profil.
  function ranksHtml(p) {
    return p.ranks.map(r => '<span class="rk ' + r.role + '"><i>' + esc(r.label) + "</i> " + esc(r.tier_name) + "</span>").join(" · ");
  }

  // Matchs déjà joués avec ou contre ce joueur : « contre lui 2V-1D · avec lui 1V-0D · il y a 3 j ».
  function ago(ts) {
    const m = Math.max(0, Math.floor((Date.now() / 1000 - ts) / 60));
    if (m < 60) return "il y a " + Math.max(1, m) + " min";
    if (m < 60 * 48) return "il y a " + Math.floor(m / 60) + " h";
    return "il y a " + Math.floor(m / 1440) + " j";
  }
  function metHtml(p) {
    const e = p.encounter;
    if (!e || e.against_wins + e.against_losses + e.with_wins + e.with_losses === 0) return "";
    const parts = [];
    if (e.against_wins + e.against_losses > 0) parts.push("contre lui " + e.against_wins + "V-" + e.against_losses + "D");
    if (e.with_wins + e.with_losses > 0) parts.push("avec lui " + e.with_wins + "V-" + e.with_losses + "D");
    parts.push(ago(e.last_seen));
    return '<div class="met">Déjà croisé · ' + esc(parts.join(" · ")) + "</div>";
  }

  function badgesHtml(p) {
    return p.badges.map((b, i) => '<span class="badge ' + b + '">' + esc(p.badge_labels[i]) + "</span>").join("");
  }

  function cardHtml(p) {
    const idx = p.smurf_index >= 50 ? '<span class="idx">Smurf ' + p.smurf_index + "</span>" : "";
    let body;
    if (p.status === "loading") body = '<div class="loading">chargement…</div>';
    else if (p.status === "failed") body = '<div class="loading">profil indisponible</div>';
    else {
      const badges = badgesHtml(p);
      body = '<div class="ranks">' + ranksHtml(p) + "</div>" + (badges ? '<div class="badges">' + badges + "</div>" : "");
    }
    body += metHtml(p);
    return '<div class="card ' + p.relation + '"><div class="row-top"><span class="name">' + esc(p.name) + "</span>" + idx + "</div>" + body + "</div>";
  }

  function chipHtml(p) {
    const idx = p.smurf_index >= 50 ? '<span class="idx">Smurf ' + p.smurf_index + "</span>" : "";
    let mid;
    if (p.status === "loading") mid = '<span class="loading">chargement…</span>';
    else if (p.status === "failed") mid = '<span class="loading">indisponible</span>';
    else mid = '<span class="best">' + ranksHtml(p) + "</span>" + idx + '<span class="badges">' + badgesHtml(p) + "</span>" + metHtml(p);
    return '<div class="chip ' + p.relation + '"><span class="name grow">' + esc(p.name) + "</span>" + mid + "</div>";
  }

  // Couleurs personnalisées : une valeur invalide est ignorée (la valeur par défaut du CSS reste).
  const HEX = /^#[0-9a-f]{6}$/i;
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(", ");
  const COLOR_VARS = { text: "--text", muted: "--muted", opponent: "--opponent", teammate: "--teammate", unknown: "--unknown",
    badge_smurf: "--b-smurf", badge_one_v_one: "--b-1v1", badge_anchor: "--b-anchor", badge_tilt: "--b-tilt", badge_peak: "--b-peak" };
  function applyColors(colors) {
    const root = document.documentElement.style;
    if (HEX.test(colors.background)) root.setProperty("--bg", rgb(colors.background));
    for (const [k, v] of Object.entries(COLOR_VARS)) if (HEX.test(colors[k])) root.setProperty(v, colors[k]);
  }

  function render(state) {
    const snap = state.snapshot, c = state.display || {};
    layout = c.overlay_layout || "card_vertical";
    scale = Math.min(200, Math.max(50, c.overlay_scale || 100));
    applyColors(c.overlay_colors || {});
    document.documentElement.style.setProperty("--a", String(Math.min(100, Math.max(10, c.overlay_opacity ?? 82)) / 100));
    $("wrap").className = layout;
    $("list").className = layout;
    $("dot").classList.toggle("on", snap.pending > 0);
    const compact = layout === "column" || layout === "row";
    $("list").innerHTML = snap.players.map(compact ? chipHtml : cardHtml).join("");
    reportSize();
  }

  // En jeu : la fenêtre suit la taille du contenu. L'échelle demandée est réduite si la
  // disposition dépasserait la largeur de l'écran.
  let lastW = 0, lastH = 0;
  function reportSize() {
    requestAnimationFrame(() => {
      const wrap = $("wrap");
      const current = parseFloat(wrap.style.zoom) || 1;
      const natural = wrap.getBoundingClientRect().width / current;
      const effective = isApp ? Math.min(scale / 100, (screen.width - 8) / Math.max(natural, 1)) : scale / 100;
      if (Math.abs(effective - current) > 0.005) {
        wrap.style.zoom = effective;
        reportSize();
        return;
      }
      if (!isApp) return;
      const r = wrap.getBoundingClientRect();
      const w = Math.max(160, Math.ceil(r.width) + 4), h = Math.max(30, Math.ceil(r.height) + 4);
      if (Math.abs(w - lastW) >= 2 || Math.abs(h - lastH) >= 2) {
        lastW = w;
        lastH = h;
        tauri.core.invoke("lt_overlay_size", { w, h });
      }
    });
  }

  if (isApp) {
    document.body.classList.add("app");
    // Glisser-déposer (actif pendant l'aperçu : hors aperçu les clics traversent la fenêtre).
    let dragging = false, sx = 0, sy = 0;
    window.addEventListener("mousedown", e => { if (e.button === 0) { dragging = true; sx = e.screenX; sy = e.screenY; } });
    window.addEventListener("mousemove", e => {
      if (!dragging) return;
      const dx = e.screenX - sx, dy = e.screenY - sy;
      if (dx || dy) { sx = e.screenX; sy = e.screenY; tauri.core.invoke("lt_drag_by", { dx, dy }); }
    });
    window.addEventListener("mouseup", () => { if (dragging) { dragging = false; tauri.core.invoke("lt_drag_finish"); } });
    tauri.core.invoke("lt_state").then(render);
    tauri.event.listen("lt-state", e => render(e.payload));
  } else {
    const source = new EventSource("/lobby/events");
    source.onmessage = e => { document.body.classList.remove("offline"); render(JSON.parse(e.data)); };
    source.onerror = () => document.body.classList.add("offline");
  }
</script>
</body>
</html>
