[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/tracker-core",
    "crates/tracker-parser",
    "crates/tracker-cache",
    "crates/tracker-heuristics",
    "crates/tracker-scraper",
    "crates/tracker-engine",
]

[workspace.package]
version = "1.4.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
tracing = "0.1"

tracker-core = { path = "crates/tracker-core" }
tracker-parser = { path = "crates/tracker-parser" }
tracker-cache = { path = "crates/tracker-cache" }
tracker-heuristics = { path = "crates/tracker-heuristics" }
tracker-scraper = { path = "crates/tracker-scraper" }
tracker-engine = { path = "crates/tracker-engine" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
